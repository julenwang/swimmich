name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml', '**/Package.resolved', 'ImmichSwiftUI.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Unit Tests (Simulator)
        run: |
          # 查找当前 Runner 上可用的 iPhone 模拟器名称
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -E "iPhone (15|16|17)" | head -n 1 | sed -E 's/^[[:space:]]+//; s/ \([0-9A-F-]+\).*//')
          if [ -z "$SIMULATOR_NAME" ]; then
            SIMULATOR_NAME="iPhone 16"
          fi
          echo "Using Simulator: $SIMULATOR_NAME"

          xcodebuild test \
            -project ImmichSwiftUI.xcodeproj \
            -scheme ImmichSwiftUI \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -only-testing:ImmichSwiftUITests \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build App & Extensions (iOS Device)
        run: |
          xcodebuild build \
            -project ImmichSwiftUI.xcodeproj \
            -scheme ImmichSwiftUI \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "ImmichSwiftUI.app" -path "*Release-iphoneos*" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find DerivedData/Build/Products -name "ImmichSwiftUI.app" -type d | head -n 1)
          fi

          if [ -d "$APP_PATH" ]; then
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -qr ImmichSwiftUI.ipa Payload
            cd ..
            echo "Successfully generated build/ImmichSwiftUI.ipa"
          else
            echo "ImmichSwiftUI.app not found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmichSwiftUI-IPA
          path: build/ImmichSwiftUI.ipa
          if-no-files-found: error


